services:
  postgres:
    image: postgres:16
    container_name: harbor_postgres
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor123
      POSTGRES_DB: harbor_manufatura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: harbor_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
